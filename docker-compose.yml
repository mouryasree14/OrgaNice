services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: organice
      POSTGRES_USER: organice
      POSTGRES_PASSWORD: organice
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  api:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://organice:organice@db:5432/organice
      JWT_SECRET: change-me
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes: [./backend:/app]
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  postgres_data:
